# Clean official-image verification only. Its model/retrieval behavior is not yet verified.
# Use an independent port and volume; never point this at the running verified data volume.
name: maxkb-official-check

services:
  maxkb:
    image: registry.fit2cloud.com/maxkb/maxkb:v2.10.7-lts@sha256:5ffdafc7956a472ea59ef6820aec5c965282d37c1875109378abae1cbbc2b067
    ports:
      - "${MAXKB_BIND_IP:-127.0.0.1}:${MAXKB_PORT:-18091}:8080"
    volumes:
      - maxkb_data:/opt/maxkb
    mem_limit: ${MAXKB_MEMORY:-8g}
    cpus: ${MAXKB_CPUS:-4}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/admin/', timeout=5)"]
      interval: 15s
      timeout: 8s
      start_period: 180s
      retries: 30
    restart: unless-stopped

volumes:
  maxkb_data:
    name: ${MAXKB_DATA_VOLUME:-maxkb_official_check_data}
